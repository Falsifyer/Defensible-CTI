# La raiz es un workspace, no un paquete: no tiene version. Cada paquete lleva la suya y su
# etiqueta (cryptonym-v0.6.0, stixforge-v0.1.0, ...), que es lo que hace que seis numeros
# signifiquen algo en vez de uno que no dice nada.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cryptonym = { workspace = true }
assessment-mcp = { workspace = true }
sharegate = { workspace = true }
stix-forge = { workspace = true }
pir-ledger = { workspace = true }
huntplan = { workspace = true }

[dependency-groups]
# Los seis son el producto: `uv sync` los instala todos en editable.
dev = [
  "cryptonym",
  "assessment-mcp",
  "sharegate",
  "stix-forge",
  "pir-ledger",
  "huntplan",
  "pytest>=9.1.1",
  "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[tool.ruff]
line-length = 100
