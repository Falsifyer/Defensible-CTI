# The root is a workspace, not a package: it has no version. Each package carries its own
# version and its own tag (cryptonym-v0.7.0, stixforge-v0.2.0, ...), which is what makes
# eight numbers mean something instead of one that says nothing.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cti-method = { workspace = true }
cti-suite = { workspace = true }
cryptonym = { workspace = true }
assessment-mcp = { workspace = true }
sharegate = { workspace = true }
stix-forge = { workspace = true }
pir-ledger = { workspace = true }
huntplan = { workspace = true }

[dependency-groups]
# The eight are the product: `uv sync` installs them all in editable mode.
dev = [
  "cti-method",
  "cryptonym",
  "assessment-mcp",
  "sharegate",
  "stix-forge",
  "pir-ledger",
  "huntplan",
  "cti-suite",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.17.1",
  "mypy>=2.4.0",
  "jsonschema>=4.26.0",
  "hypothesis>=6.170.2",
  "pip-audit>=2.10.1",
]

[tool.uv]
# Transitive dependencies with open advisories in the lock. Pinned here so the
# environment and the SBOM do not carry known vulnerable versions.
constraint-dependencies = [
  "pyjwt>=2.15.0",
  "starlette>=1.3.1",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
# Los paquetes repiten nombres de modulo de test (test_core.py, test_cli.py...). El modo
# importlib resolves them by path; the default mode fails when collecting from the root.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["packages/*/src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true
