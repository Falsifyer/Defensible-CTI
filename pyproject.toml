# The root is a workspace, not a package: it has no version. Each package carries its own
# version and its own tag (cryptonym-v0.7.0, stixforge-v0.2.0, ...), which is what makes
# eight numbers mean something instead of one that says nothing.

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
cti-method = { workspace = true }
cti-suite = { workspace = true }
cryptonym = { workspace = true }
assessment-mcp = { workspace = true }
sharegate = { workspace = true }
stix-forge = { workspace = true }
pir-ledger = { workspace = true }
huntplan = { workspace = true }

[dependency-groups]
# The eight are the product: `uv sync` installs them all in editable mode.
dev = [
  "cti-method",
  "cryptonym",
  "assessment-mcp",
  "sharegate",
  "stix-forge",
  "pir-ledger",
  "huntplan",
  "cti-suite",
  "pytest>=9.1.1",
  "pytest-cov>=5",
  "ruff>=0.17.1",
  "mypy>=1.11",
  "jsonschema>=4.22",
  "hypothesis>=6.100",
  "pip-audit>=2.7",
]

[tool.uv]
# Transitive dependencies with open advisories in the lock. Pinned here so the
# environment and the SBOM do not carry known vulnerable versions.
constraint-dependencies = [
  "pyjwt>=2.15.0",
  "starlette>=1.3.1",
]
# pycti (an optional extra of cryptonym) pins setuptools~=82.0.0 and opentelemetry-*~=1.35.0;
# those pins carry GHSA-xmj3-9gf7-h52w and CVE-2026-114603. Constraints cannot lift a `~=` pin,
# so they are overridden here for the whole workspace. Checked against pycti 7.261026.0 on
# 2026-10-26: the latest release still carries both pins. The default sync therefore excludes
# the opencti extra (`--no-extra opencti`); enabling it intentionally reintroduces the
# unsupported pin combination and `pip check` will report it.
override-dependencies = [
  "setuptools>=84.1.0",
  "opentelemetry-api>=1.45.1",
  "opentelemetry-sdk>=1.45.1",
]

[tool.pytest.ini_options]
testpaths = ["packages"]
# Packages reuse test module names (test_core.py, test_cli.py...). importlib mode
# resolves them by path; the default mode fails when collecting from the root.
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
files = ["packages/*/src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["packages"]

[tool.coverage.report]
show_missing = true
skip_covered = true
