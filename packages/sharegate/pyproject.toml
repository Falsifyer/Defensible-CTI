[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharegate"
version = "0.2.0"
description = "Pre-share compliance gate for CTI: TLP 2.0 and STIX 2.1, judged against external schemas"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martín Eliseo", email = "124847072+Falsifyer@users.noreply.github.com" }]
keywords = ["cti", "tlp", "stix", "threat-intelligence", "compliance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["cti-method"]

[tool.uv.sources]
cti-method = { workspace = true }

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7", "mcp>=2.0"]

[project.scripts]
sharegate = "sharegate.cli:main"
sharegate-mcp = "sharegate.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["sharegate"]

[tool.coverage.report]
fail_under = 80
show_missing = true
