[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-suite"
version = "0.1.0"
description = "The cycle in one artifact and one MCP facade: PIR, judgement, hunt plan, STIX product, share gate"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martín Eliseo", email = "124847072+Falsifyer@users.noreply.github.com" }]
keywords = ["cti", "threat-intelligence", "stix", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["cti-method", "pir-ledger", "cryptonym", "assessment-mcp", "huntplan", "stix-forge", "sharegate"]

[tool.uv.sources]
cti-method = { workspace = true }
pir-ledger = { workspace = true }
cryptonym = { workspace = true }
assessment-mcp = { workspace = true }
huntplan = { workspace = true }
stix-forge = { workspace = true }
sharegate = { workspace = true }

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mcp>=2.0", "jsonschema>=4.22"]

[project.scripts]
ctisuite = "cti_suite.cli:main"
ctisuite-mcp = "cti_suite.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["cti_suite"]

[tool.coverage.report]
fail_under = 80
show_missing = true
