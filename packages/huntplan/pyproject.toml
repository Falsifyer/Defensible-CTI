[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "huntplan"
version = "0.1.0"
description = "Turn a question into a falsifiable threat-hunting plan: If/then hypothesis, ATT&CK data sources, closure and maturity"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martín Eliseo", email = "124847072+ME0094@users.noreply.github.com" }]
keywords = ["threat-hunting", "mitre-attack", "cti", "detection", "hmm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "bandit>=1.7", "mcp>=2.0"]

[project.scripts]
huntplan = "huntplan.cli:main"
huntplan-mcp = "huntplan.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["huntplan"]

[tool.coverage.report]
fail_under = 80
show_missing = true
