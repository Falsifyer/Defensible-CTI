[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pir-ledger"
version = "0.2.0"
description = "PIR, EEI and indicator register: a PIR is a question tied to a decision, and it can be rejected."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martín Eliseo" }]
keywords = ["cti", "intelligence-requirements", "pir", "eei"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]

dependencies = ["cti-method"]

[tool.uv.sources]
cti-method = { workspace = true }

[project.scripts]
pir = "pir_ledger.cli:main"
pir-mcp = "pir_ledger.mcp_server:main"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mcp>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
