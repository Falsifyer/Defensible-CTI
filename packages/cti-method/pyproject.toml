[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cti-method"
version = "0.2.0"
description = "The shared core of cti-suite: graded confidence, ACH, external truth, one STIX validator and one exit-code contract"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martín Eliseo", email = "124847072+ME0094@users.noreply.github.com" }]
keywords = ["cti", "ach", "confidence", "stix", "threat-intelligence"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
schemas = ["jsonschema>=4.22"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "jsonschema>=4.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The schemas are the contract of the six formats: they travel with the core.
cti_method = ["schemas/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["cti_method"]

[tool.coverage.report]
fail_under = 80
show_missing = true
