[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stix-forge"
version = "0.2.0"
description = "Build STIX 2.1 bundles from an intelligence product, with provenance and a TLP marking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Martín Eliseo" }]
keywords = ["cti", "stix", "threat-intelligence", "sharing"]

[project.scripts]
stixforge = "stixforge.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.22", "stix2>=3.0"]
external = ["stix2>=3.0", "stix2-validator>=3", "jsonschema>=4.22"]

[tool.setuptools.package-data]
stixforge = ["schemas/stix2.1/LICENSE", "schemas/stix2.1/README.md", "schemas/stix2.1/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
