name: Publish to PyPI

# Trusted publishing (OIDC): there is no PyPI token in the repository.
# It needs, once and by hand:
#   1. reserve the names on PyPI and configure a pending publisher per package
#      pointing at this repository, this workflow and the `pypi` environment;
#   2. create the `pypi` environment on GitHub.
# Until that exists this workflow publishes nothing: the OIDC step fails.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Distribution name to publish (e.g. cti-method)"
        required: true
      dry_run:
        description: "Build and check only"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras

      - name: Resolve the package from the release or the input
        id: pkg
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE: ${{ github.event.inputs.package }}
        run: |
          if [ -n "$INPUT_PACKAGE" ]; then
            uv run python -m cti_suite.release --package "$INPUT_PACKAGE" --github-output
          else
            uv run python -m cti_suite.release --tag "$RELEASE_TAG" --check --github-output
          fi

      - name: Construir
        run: uv build --package "${{ steps.pkg.outputs.package }}" --out-dir dist

      - name: Check that the wheel installs and starts
        run: |
          python -m venv /tmp/pubcheck
          /tmp/pubcheck/bin/pip install --quiet dist/*.whl
          /tmp/pubcheck/bin/python -c "import importlib.metadata as m; print(m.version('${{ steps.pkg.outputs.package }}'))"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
