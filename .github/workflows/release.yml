name: Release

# Each package carries its own version and its own tag: `cryptonym-v0.7.0`,
# `stixforge-v0.2.0`, ... The tag picks the package; nothing else is published.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. stixforge-v0.2.0"
        required: true
      dry_run:
        description: "Build and verify, but do not create the release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
      package: ${{ steps.pkg.outputs.package }}
      version: ${{ steps.pkg.outputs.version }}
      directory: ${{ steps.pkg.outputs.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Resolve package, directory and version from the tag
        id: pkg
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # The tag -> package mapping is code with tests, not a `case` in YAML.
        run: uv run --package cti-suite python -m cti_suite.release --tag "$TAG" --check --github-output

      - run: uv sync --all-packages --all-extras --no-extra opencti

      - name: The tag version is the package version
        run: uv run python -m cti_suite.release --tag "${{ steps.pkg.outputs.tag }}" --check

      - name: Tests before publishing
        run: uv run pytest -q

      - name: Build the package
        run: uv build --package "${{ steps.pkg.outputs.package }}" --out-dir dist

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ steps.pkg.outputs.package }}-${{ steps.pkg.outputs.version }}.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/

  publish:
    needs: build
    # A tag push always publishes; a manual run only when dry_run is false.
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist

      - name: Sign the artifacts (sigstore, keyless)
        # Signing is the only step that needs `id-token: write`; it runs on the downloaded
        # artifacts, not on a checkout of the tree. The CLI is pinned so the signer itself
        # is reproducible.
        run: uvx --from 'sigstore==4.5.1' sigstore sign dist/*.whl dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.build.outputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ needs.build.outputs.tag }}" \
            --notes "Package \`${{ needs.build.outputs.package }}\` at \`${{ needs.build.outputs.version }}\`. Detail: \`packages/${{ needs.build.outputs.directory }}/CHANGELOG.md\`."
