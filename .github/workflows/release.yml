      - name: Sign the artifacts (sigstore, keyless)
        # The action cannot be used: its v3.x environment pins pyjwt==2.13.0 while its own
        # resolver requires >=2.15.0, so it dies in setup before signing anything. The CLI
        # signs the same way and takes the Actions OIDC token from the ambient environment,
        # which is why this job declares `id-token: write`.
        run: uvx --from sigstore sigstore sign dist/*.whl dist/*.tar.gz
