name: Release

# Cada paquete lleva su propia version y su propia etiqueta: `cryptonym-v0.7.0`,
# `stixforge-v0.2.0`, ... El tag elige el paquete; el resto no se publica.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. stixforge-v0.2.0"
        required: true
      dry_run:
        description: "Build and verify, but do not create the release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolver paquete, directorio y version desde la etiqueta
        id: pkg
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # La correspondencia tag -> paquete es codigo con tests, no un `case` en YAML.
        run: uv run --no-project python -m cti_suite.release --tag "$TAG" --check --github-output

      - run: uv sync --all-packages --all-extras

      - name: La version de la etiqueta es la del paquete
        run: uv run python -m cti_suite.release --tag "${{ steps.pkg.outputs.tag }}" --check

      - name: Pruebas antes de publicar
        run: uv run pytest -q

      - name: Construir el paquete
        run: uv build --package "${{ steps.pkg.outputs.package }}" --out-dir dist

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ steps.pkg.outputs.package }}-${{ steps.pkg.outputs.version }}.cdx.json

      - name: Firmar los artefactos (sigstore, keyless)
        uses: sigstore/gh-action-sigstore-python@v3
        with:
          inputs: dist/*.whl dist/*.tar.gz

      - name: Publicar la release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" dist/* \
            --title "${{ steps.pkg.outputs.tag }}" \
            --notes "Package \`${{ steps.pkg.outputs.package }}\` at \`${{ steps.pkg.outputs.version }}\`. Detail: \`packages/${{ steps.pkg.outputs.directory }}/CHANGELOG.md\`."
