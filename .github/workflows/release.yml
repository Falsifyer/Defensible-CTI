name: Release

# Each package carries its own version and its own tag: `cryptonym-v0.7.0`,
# `stixforge-v0.2.0`, ... The tag picks the package; nothing else is published.
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. stixforge-v0.2.0"
        required: true
      dry_run:
        description: "Build and verify, but do not create the release"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve package, directory and version from the tag
        id: pkg
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        # The tag -> package mapping is code with tests, not a `case` in YAML.
        run: uv run --no-project python -m cti_suite.release --tag "$TAG" --check --github-output

      - run: uv sync --all-packages --all-extras

      - name: The tag version is the package version
        run: uv run python -m cti_suite.release --tag "${{ steps.pkg.outputs.tag }}" --check

      - name: Tests before publishing
        run: uv run pytest -q

      - name: Build the package
        run: uv build --package "${{ steps.pkg.outputs.package }}" --out-dir dist

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/${{ steps.pkg.outputs.package }}-${{ steps.pkg.outputs.version }}.cdx.json

      - name: Sign the artifacts (sigstore, keyless)
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.pkg.outputs.tag }}" dist/* \
            --title "${{ steps.pkg.outputs.tag }}" \
            --notes "Package \`${{ steps.pkg.outputs.package }}\` at \`${{ steps.pkg.outputs.version }}\`. Detail: \`packages/${{ steps.pkg.outputs.directory }}/CHANGELOG.md\`."
