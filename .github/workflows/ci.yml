name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --all-packages --all-extras
      # Packages reuse test module names; --import-mode=importlib (in the root
      # pyproject) resolves them by path. This is the invocation that used to fail.
      - run: uv run pytest -q

  lint:
    name: Estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run ruff check packages

  types:
    name: Tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv run mypy

  evaluation:
    name: Method evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      # Without this the evaluation is decorative: it never runs and rots.
      - name: Corpus por split
        run: uv run python packages/cryptonym/evaluation/run_evaluation.py --corpus --check
      - name: Corpus adjudicado, estricto
        run: uv run python packages/cryptonym/evaluation/run_evaluation.py --adjudicated --check --strict
      - name: El dossier publicado se reproduce
        run: uv run python packages/cryptonym/evaluation/run_evaluation.py --dossier packages/cryptonym/assessments/voltzite-vs-volt-typhoon/assessment.json > /dev/null

  demo:
    name: La cadena entera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - name: make demo
        run: make demo
      - name: The bundle the demo produces is valid and shareable
        run: |
          uv run stixforge validate demo/out/bundle.json
          uv run stixforge validate demo/out/bundle.json --external
          uv run sharegate check demo/out/bundle.json
      - name: The chain reaches the bundle
        run: |
          python - <<'PY'
          import json, sys
          bundle = json.load(open("demo/out/bundle.json"))
          report = next(o for o in bundle["objects"] if o["type"] == "report")
          refs = {r["source_name"]: r["external_id"] for r in report["external_references"]}
          # The reference carries the content hash: <id>@<sha256:12>.
          ids = {kind: value.split("@")[0] for kind, value in refs.items()}
          expected = {"cti-suite:pir": "PIR-001", "cti-suite:assessment": "nightjar-vs-saltwind", "cti-suite:hunt": "HUNT-001"}
          if ids != expected:
              sys.exit(f"trace mismatch: {refs}")
          if not all("@" in value for value in refs.values()):
              sys.exit(f"trace without content hash: {refs}")
          verdict = json.load(open("demo/out/verdict.json"))
          import hashlib
          digest = hashlib.sha256(json.dumps(verdict, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()).hexdigest()[:12]
          if refs["cti-suite:assessment"].split("@")[1] != digest:
              sys.exit(f"assessment hash mismatch: {refs['cti-suite:assessment']} != {digest}")
          print("trace ok:", refs)
          PY
      - name: El ledger verifica
        run: uv run assessment ledger demo/out/ledger.jsonl --verify
      - name: El producto legible existe
        run: test -s demo/out/product.md

  build:
    name: Paquetes construibles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      - run: uv build --all-packages --out-dir dist
      - name: Los paquetes instalados funcionan (datos incluidos)
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist/*.whl mcp
          # The ATT&CK map and the docs are read at import time: if they do not travel in
          # the wheel, the installed package breaks and nobody finds out until they install it.
          /tmp/wheelcheck/bin/python -c "from huntplan.core import attack_provenance; print('attack', attack_provenance()['attack_version'])"
          /tmp/wheelcheck/bin/python -c "from assessment.core import method_documentation; print('docs', method_documentation('method')['section'])"
          /tmp/wheelcheck/bin/ctisuite --version
          /tmp/wheelcheck/bin/huntplan hmm > /dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/

  security:
    name: Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --all-extras
      # pycti (the `opencti` extra) pins setuptools to a band that excludes 83; 82.0.1
      # is only used as a build backend and the suite never imports it. The advisory is
      # documented in SECURITY.md; no other advisory is ignored.
      - run: uv run pip-audit --skip-editable --ignore-vuln PYSEC-2026-3447

  infra:
    name: Infraestructura (workflows y shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: raven-actions/actionlint@v2
      - name: shellcheck
        run: shellcheck demo/run.sh

  credentials:
    name: Credenciales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No credentials in the tree
        run: |
          patron='(-----BEGIN [A-Z ]*PRIVATE KEY-----|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|://[^/:@ ]+:[^/ @]+@)'
          # The `dsh-secrets:allow` marker exempts a line, as in the harness hook: the test
          # fixtures keep credential-shaped samples on purpose.
          if git ls-files -z | xargs -0 grep -nEI "$patron" | grep -v 'dsh-secrets:allow'; then
            echo "::error::credential in the versioned tree"
            exit 1
          fi
          echo "no credentials"
