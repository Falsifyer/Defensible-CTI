version: 2

# Version-update PRs are off (limit 0) until there is a maintainer with time to review
# them: on the first day this repository opened four of them, one bumping actions/checkout
# from 4 to 7. Security updates keep working through the repository setting.
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
